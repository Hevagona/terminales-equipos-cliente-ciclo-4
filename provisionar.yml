- name: Servidor de pruebas - Registro de Visitas
  hosts: localhost
  connection: local
  become: true

  vars:
    registro_clave: "{{ lookup('ansible.builtin.env', 'REGISTRO_CLAVE') }}"

  tasks:
    - name: Mostrar que la clave se leyó sin mostrarla
      ansible.builtin.debug:
        msg: "Clave cargada, longitud {{ registro_clave | length }}"

    - name: La clave del servidor de pruebas está en el entorno
      ansible.builtin.assert:
        that:
          - registro_clave | length > 0
        fail_msg: >
          Falta REGISTRO_CLAVE. Definela como secreto de Codespaces
          (Settings > Codespaces > Codespaces secrets) y abre un Codespace nuevo,
          o en esta terminal: read -s REGISTRO_CLAVE && export REGISTRO_CLAVE
        quiet: true

    - name: Instalar paquetes del sistema necesarios
      ansible.builtin.package:
        name:
          - python3-venv
          - sqlite3
        state: present

    - name: Crear grupo registro
      ansible.builtin.group:
        name: registro
        state: present

    - name: Crear usuario registro
      ansible.builtin.user:
        name: registro
        group: registro
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Crear carpeta /opt/registro
      ansible.builtin.file:
        path: /opt/registro
        state: directory
        owner: registro
        group: registro
        mode: "0750"

    - name: La configuración del ambiente de pruebas
      ansible.builtin.copy:
        dest: /opt/registro/registro.env
        content: |
          TZ=America/Bogota
          REGISTRO_DB=/opt/registro/registro.db
          REGISTRO_CLAVE={{ registro_clave }}
        owner: registro
        group: registro
        mode: "0600"
      no_log: true

    - name: Copiar archivos de la aplicación a /opt/registro
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/opt/registro/{{ item }}"
        owner: registro
        group: registro
        mode: "0644"
      loop:
        - app.py
        - crear_db.py
        - requirements.txt

    - name: Crear ambiente virtual e instalar dependencias
      ansible.builtin.pip:
        requirements: /opt/registro/requirements.txt
        virtualenv: /opt/registro/venv
        virtualenv_command: python3 -m venv
      become_user: registro

    - name: Inicializar la base de datos
      ansible.builtin.command:
        cmd: /opt/registro/venv/bin/python crear_db.py
        chdir: /opt/registro
        creates: /opt/registro/registro.db
      environment:
        REGISTRO_DB: /opt/registro/registro.db
      become_user: registro

    - name: Contar visitas en la base de datos
      ansible.builtin.command:
        cmd: sqlite3 /opt/registro/registro.db "SELECT COUNT(*) FROM visitas;"
      register: conteo_visitas
      changed_when: false

    - name: Insertar visita de verificación si la base está vacía
      ansible.builtin.command:
        cmd: >
          sqlite3 /opt/registro/registro.db
          "INSERT INTO visitas (nombre, momento) VALUES ('Visita de verificacion', datetime('now', 'localtime'));"
      when: conteo_visitas.stdout == "0"
      become_user: registro

    - name: Asegurar permisos correctos en toda la carpeta /opt/registro
      ansible.builtin.file:
        path: /opt/registro
        owner: registro
        group: registro
        recurse: false
        mode: "0750"
